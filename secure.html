<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Marketing Hub · Đăng nhập</title><link rel="stylesheet" href="style.css"><style>.app{display:none}.login-screen{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{max-width:440px;width:100%}.login-card h1{font-size:27px}.login-card button{width:100%;margin-top:8px}.login-card .error{color:#a33;white-space:pre-wrap}.cloud-bar{display:none;padding:10px 20px;background:#e9f1e6;justify-content:space-between;gap:10px}.cloud-bar .link{white-space:nowrap}</style></head><body><section id="login" class="login-screen"><div class="card login-card"><span class="eyebrow">MARKETING HUB</span><h1>Không gian của bạn</h1><p class="muted">Nhập email đã được cấp quyền. Chúng tôi sẽ gửi liên kết đăng nhập đến email của bạn.</p><form id="login-form"><label class="field">Email<input name="email" type="email" autocomplete="email" required></label><button class="primary">Gửi liên kết đăng nhập</button></form><p id="login-status" class="muted" role="status"></p></div></section><div id="cloud-bar" class="cloud-bar"><span id="cloud-status" role="status">Đang tải…</span><button id="logout" class="link">Đăng xuất</button></div><div class="app"><aside><div class="brand"><span>✳</span><div>Marketing Hub<small>PERSONAL WORKSPACE</small></div></div><p class="nav-label">KHÔNG GIAN LÀM VIỆC</p><nav id="nav"></nav><div class="aside-bottom"><b>Không gian của bạn</b><small>Dữ liệu của bạn</small></div></aside><main><header><div><span class="eyebrow">WORKSPACE / <span id="crumb">TỔNG QUAN</span></span><h1 id="heading"></h1><p id="subtitle"></p></div><button id="add" class="primary">＋ Thêm mới</button></header><div id="content"></div><footer>Đồng bộ theo tài khoản · <button class="link" id="export">Xuất bản sao</button> · <label class="link">Nhập bản sao<input id="import" type="file" accept="application/json" hidden></label></footer></main></div><dialo
